name: Bug Monitor

on:
  workflow_dispatch:
  schedule:
    # Run every 20 minutes away from the top-of-hour load peak.
    - cron: "10,30,50 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: discord-bug-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore encrypted runtime configuration
        env:
          CONFIG_B64: ${{ secrets.BUG_ENV_B64 }}
        run: |
          test -n "$CONFIG_B64"
          mkdir -p .runtime
          printf '%s' "$CONFIG_B64" | base64 --decode > .runtime/bug.env
          chmod 600 .runtime/bug.env
      - name: Check new Bugs
        env:
          BUG_LAST_CHECKED_AT_UTC: ${{ vars.BUG_LAST_CHECKED_AT_UTC }}
          BUG_STATELESS_LOOKBACK_MINUTES: "10080"
        run: |
          for attempt in 1 2 3; do
            python bug_monitor.py --env-file .runtime/bug.env --mode once && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Persist last successful Bug check
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .bug_report_state.json ]; then
            value=$(python -c "import json; print(json.load(open('.bug_report_state.json', encoding='utf-8'))['last_checked_at_utc'])")
            gh variable set BUG_LAST_CHECKED_AT_UTC --body "$value"
          fi
