name: Bug Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-bug-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore encrypted runtime configuration
        env:
          CONFIG_B64: ${{ secrets.BUG_ENV_B64 }}
        run: |
          test -n "$CONFIG_B64"
          mkdir -p .runtime
          printf '%s' "$CONFIG_B64" | base64 --decode > .runtime/bug.env
          chmod 600 .runtime/bug.env
      - name: Restore last successful Bug check
        run: |
          git fetch --no-tags --depth=1 origin state-bug
          git show FETCH_HEAD:.bug_report_state.json > .bug_report_state.json
      - name: Check new Bugs
        env:
          BUG_STATELESS_LOOKBACK_MINUTES: "10080"
          BUG_ENFORCE_CHECK_INTERVAL: "true"
        run: |
          for attempt in 1 2 3; do
            python bug_monitor.py --env-file .runtime/bug.env --mode once && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Persist last successful Bug check
        if: ${{ always() }}
        run: |
          if [ -f .bug_report_state.json ]; then
            cp .bug_report_state.json "$RUNNER_TEMP/bug-state.json"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git fetch --no-tags --depth=1 origin state-bug
            git checkout --detach --force FETCH_HEAD
            cp "$RUNNER_TEMP/bug-state.json" .bug_report_state.json
            git add -f .bug_report_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Bug monitor state"
              git push origin HEAD:state-bug
            fi
          fi
