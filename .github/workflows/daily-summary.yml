name: Daily Summary

on:
  workflow_dispatch:
  schedule:
    # UTC 10:10 = Beijing 18:10; report boundary stays at 18:00.
    - cron: "10 10 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: discord-daily-summary
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore encrypted runtime configuration
        env:
          CONFIG_B64: ${{ secrets.DAILY_ENV_B64 }}
        run: |
          test -n "$CONFIG_B64"
          mkdir -p .runtime
          printf '%s' "$CONFIG_B64" | base64 --decode > .runtime/daily.env
          chmod 600 .runtime/daily.env
      - name: Send daily summary
        env:
          DAILY_LAST_REPORTED_DATE: ${{ vars.DAILY_LAST_REPORTED_DATE }}
        run: |
          for attempt in 1 2 3; do
            python daily_summary.py --env-file .runtime/daily.env --mode once --catch-up && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          exit 1
      - name: Persist last successful Daily Summary date
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .daily_summary_state.json ]; then
            value=$(python -c "import json; print(json.load(open('.daily_summary_state.json', encoding='utf-8'))['last_reported_date'])")
            gh variable set DAILY_LAST_REPORTED_DATE --body "$value"
          fi
