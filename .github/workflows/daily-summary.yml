name: Daily Summary

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-daily-summary
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore encrypted runtime configuration
        env:
          CONFIG_B64: ${{ secrets.DAILY_ENV_B64 }}
        run: |
          test -n "$CONFIG_B64"
          mkdir -p .runtime
          printf '%s' "$CONFIG_B64" | base64 --decode > .runtime/daily.env
          chmod 600 .runtime/daily.env
      - name: Restore last successful Daily Summary date
        run: |
          git fetch --no-tags --depth=1 origin state-daily
          git show FETCH_HEAD:.daily_summary_state.json > .daily_summary_state.json
      - name: Send daily summary
        run: |
          for attempt in 1 2 3; do
            python daily_summary.py --env-file .runtime/daily.env --mode once --catch-up && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          exit 1
      - name: Persist last successful Daily Summary date
        if: ${{ always() }}
        run: |
          if [ -f .daily_summary_state.json ]; then
            cp .daily_summary_state.json "$RUNNER_TEMP/daily-state.json"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git fetch --no-tags --depth=1 origin state-daily
            git checkout --detach --force FETCH_HEAD
            cp "$RUNNER_TEMP/daily-state.json" .daily_summary_state.json
            git add -f .daily_summary_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Daily Summary state"
              git push origin HEAD:state-daily
            fi
          fi
