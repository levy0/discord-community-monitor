name: General and Language Channels Report

on:
  workflow_dispatch:
  schedule:
    # Redundant off-peak wakeups from Beijing 08:02 through 22:57. The persisted
    # boundary guarantees each due hourly window is reported at most once.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-14 * * *"

permissions:
  contents: write

concurrency:
  group: discord-language-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore encrypted runtime configuration
        env:
          CONFIG_B64: ${{ secrets.LANGUAGE_ENV_B64 }}
        run: |
          test -n "$CONFIG_B64"
          mkdir -p .runtime
          printf '%s' "$CONFIG_B64" | base64 --decode > .runtime/language.env
          chmod 600 .runtime/language.env
      - name: Restore last successful Language boundary
        run: |
          git fetch --no-tags --depth=1 origin state-language
          git show FETCH_HEAD:.language_report_state.json > .language_report_state.json
      - name: Analyze General and language channels
        run: |
          for attempt in 1 2 3; do
            python language_channels_report.py --env-file .runtime/language.env --mode once && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Persist last successful Language boundary
        if: ${{ always() }}
        run: |
          if [ -f .language_report_state.json ]; then
            cp .language_report_state.json "$RUNNER_TEMP/language-state.json"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git fetch --no-tags --depth=1 origin state-language
            git checkout --detach --force FETCH_HEAD
            cp "$RUNNER_TEMP/language-state.json" .language_report_state.json
            git add -f .language_report_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Language report state"
              git push origin HEAD:state-language
            fi
          fi
