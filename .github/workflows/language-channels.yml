name: General and Language Channels Report

on:
  workflow_dispatch:
  schedule:
    # UTC 00:10-14:10 = Beijing 08:10-22:10; report boundaries stay hourly.
    - cron: "10 0-14 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: discord-language-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore encrypted runtime configuration
        env:
          CONFIG_B64: ${{ secrets.LANGUAGE_ENV_B64 }}
        run: |
          test -n "$CONFIG_B64"
          mkdir -p .runtime
          printf '%s' "$CONFIG_B64" | base64 --decode > .runtime/language.env
          chmod 600 .runtime/language.env
      - name: Analyze General and language channels
        env:
          LANGUAGE_LAST_END_UTC: ${{ vars.LANGUAGE_LAST_END_UTC }}
        run: |
          for attempt in 1 2 3; do
            python language_channels_report.py --env-file .runtime/language.env --mode once && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Persist last successful Language boundary
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .language_report_state.json ]; then
            value=$(python -c "import json; print(json.load(open('.language_report_state.json', encoding='utf-8'))['last_report_end_utc'])")
            gh variable set LANGUAGE_LAST_END_UTC --body "$value"
          fi
