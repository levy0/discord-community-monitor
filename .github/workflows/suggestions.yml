name: Suggestions Report

on:
  workflow_dispatch:
  schedule:
    # UTC 00:10-14:10 = Beijing 08:10-22:10; report boundaries stay hourly.
    - cron: "10 0-14 * * *"

permissions:
  contents: write

concurrency:
  group: discord-suggestions-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore encrypted runtime configuration
        env:
          CONFIG_B64: ${{ secrets.SUGGESTIONS_ENV_B64 }}
        run: |
          test -n "$CONFIG_B64"
          mkdir -p .runtime
          printf '%s' "$CONFIG_B64" | base64 --decode > .runtime/suggestions.env
          chmod 600 .runtime/suggestions.env
      - name: Restore last successful Suggestions boundary
        run: |
          git fetch --no-tags --depth=1 origin state-suggestions
          git show FETCH_HEAD:.suggestions_report_state.json > .suggestions_report_state.json
      - name: Analyze Suggestions
        run: |
          for attempt in 1 2 3; do
            python suggestions_report.py --env-file .runtime/suggestions.env --mode once && exit 0
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Persist last successful Suggestions boundary
        if: ${{ always() }}
        run: |
          if [ -f .suggestions_report_state.json ]; then
            cp .suggestions_report_state.json "$RUNNER_TEMP/suggestions-state.json"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git fetch --no-tags --depth=1 origin state-suggestions
            git checkout --detach --force FETCH_HEAD
            cp "$RUNNER_TEMP/suggestions-state.json" .suggestions_report_state.json
            git add -f .suggestions_report_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Suggestions report state"
              git push origin HEAD:state-suggestions
            fi
          fi
